# the following vars must be specified:
#
#   ((number))              the PR number
#   ((branch))              only PRs against this branch will be run
#   ((dev_image_tag))       the tag to use for the dev image
#   ((concourse_image_tag)) the tag to use for the concourse image for upgrade/downgrade test in integration

---
pending_status_notification: &pending_status_notification
  put: pr-status-update
  resource: concourse-pr
  params:
    ref: ((.:concourse-pr.ref))
    name: concourse-ci/$BUILD_JOB_NAME
    status: pending
  no_get: true

status_notifications: &status_notifications
  on_success:
    put: pr-status-update
    resource: concourse-pr
    params:
      ref: ((.:concourse-pr.ref))
      name: concourse-ci/$BUILD_JOB_NAME
      status: success
    no_get: true
  on_failure:
    put: pr-status-update
    resource: concourse-pr
    params:
      ref: ((.:concourse-pr.ref))
      name: concourse-ci/$BUILD_JOB_NAME
      status: failure
    no_get: true
  on_abort:
    put: pr-status-update
    resource: concourse-pr
    params:
      ref: ((.:concourse-pr.ref))
      name: concourse-ci/$BUILD_JOB_NAME
      status: failure
    no_get: true
  on_error:
    put: pr-status-update
    resource: concourse-pr
    params:
      ref: ((.:concourse-pr.ref))
      name: concourse-ci/$BUILD_JOB_NAME
      status: failure
    no_get: true

resource_types:
  - name: github
    type: registry-image
    source:
      repository: pixelairio/github-resource
      tag: latest

resources:
  - name: concourse-base
    type: git
    icon: github
    source:
      uri: https://github.com/concourse/concourse.git
      branch: ((branch))

  - name: concourse-pr
    type: github
    icon: source-pull
    source:
      kind: pr
      repository: concourse/concourse
      access_token: ((pull_requests_access_token))
      number: ((number))

  - name: ci
    type: git
    icon: github
    source:
      uri: https://github.com/concourse/ci
      branch: master

  - name: concourse-image
    type: registry-image
    icon: docker
    source:
      repository: concourse/concourse
      tag: ((concourse_image_tag))
      username: ((docker.username))
      password: ((docker.password))

  - name: dev-image
    type: registry-image
    icon: docker
    source:
      repository: concourse/dev
      tag: ((dev_image_tag))
      username: ((docker.username))
      password: ((docker.password))

  - name: pr-image
    type: registry-image
    icon: docker
    source:
      repository: concourse/dev
      tag: pr-((number))
      username: ((docker.username))
      password: ((docker.password))

  - name: unit-image
    type: registry-image
    icon: docker
    source: { repository: concourse/unit }

  - name: golang-builder-image
    type: registry-image
    icon: docker
    source: { repository: concourse/golang-builder }

  - name: postgres-image
    type: registry-image
    icon: docker
    source: { repository: postgres }

  - name: vault-image
    type: registry-image
    icon: docker
    source: { repository: vault }

  - name: oci-build-task
    type: registry-image
    icon: docker
    source:
      repository: concourse/oci-build-task

jobs:
  - name: pr-image
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    plan:
      - in_parallel:
          - get: concourse-pr
            trigger: true
          - get: oci-build-task
          - get: dev-image
            params: { format: oci }
          - get: ci
      - task: yarn-build
        file: ci/tasks/yarn-build/task.yml
        input_mapping: { concourse: concourse-pr }
      - task: build
        image: oci-build-task
        privileged: true
        config:
          platform: linux
          params:
            CONTEXT: built-concourse
            IMAGE_ARG_base_image: dev-image/image.tar
            TARGET: with-fly
          inputs: [{ name: built-concourse }, { name: dev-image }]
          outputs: [{ name: image }]
          caches: [{ path: cache }]
          run: { path: build }
      - put: pr-image
        params: { image: image/image.tar }
        no_get: true

  - name: unit
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
              - *pending_status_notification
          - get: concourse-base
          - get: unit-image
          - get: ci
      - task: check-migration-order
        timeout: 5m
        image: unit-image
        file: ci/tasks/check-migration-order/task.yml
        params:
          pr_title: ((.:concourse-pr.title))
      - task: yarn-analyse
        image: unit-image
        file: ci/tasks/yarn-analyse/task.yml
        input_mapping: { concourse: concourse-pr }
      - task: yarn-test
        image: unit-image
        file: ci/tasks/yarn-test/task.yml
        input_mapping: { concourse: concourse-pr }
      - task: yarn-benchmark
        image: unit-image
        file: ci/tasks/yarn-benchmark/task.yml
        input_mapping: { concourse: concourse-pr }
      - timeout: 1h
        in_parallel:
          - task: unit
            image: unit-image
            file: ci/tasks/unit/task.yml
            input_mapping: { concourse: built-concourse }
          - task: unit-baggageclaim
            attempts: 3
            image: unit-image
            file: ci/tasks/unit-baggageclaim/task.yml
            privileged: true
            input_mapping: { concourse: built-concourse }

  - name: validate-labels
    public: true
    serial: true
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
                tags: [pr]
              - *pending_status_notification
          - get: ci
      - task: validate-pr
        timeout: 5m
        file: ci/tasks/validate-pr/task.yml
        params:
          GITHUB_TOKEN: ((concourse_github_dummy.access_token))
          PRNUMBER: ((.:concourse-pr.pr))

  - name: compile-check
    public: true
    serial: true
    serial_groups: [heavy]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
                tags: [pr]
              - *pending_status_notification
          - get: ci
            tags: [pr]
          - get: unit-image
            tags: [pr]
      - across:
          - var: platform
            max_in_flight: 1
            values:
              # Skip linux because we compile for linux in the pr-image job
              - os: darwin
                arch: amd64
              - os: windows
                arch: amd64
        fail_fast: true
        task: concourse-compile
        image: unit-image
        file: ci/tasks/concourse-compile/task.yml
        input_mapping:
          concourse: concourse-pr
        params:
          PLATFORM: ((.:platform.os))
          ARCH: ((.:platform.arch))

  - name: containerd-integration
    public: true
    serial: true
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
              - *pending_status_notification
          - get: dev-image
          - get: ci
      - task: integration
        image: dev-image
        privileged: true
        timeout: 2h
        file: ci/tasks/containerd-integration/task.yml
        input_mapping: { concourse: concourse-pr }

  - name: testflight
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                passed: [pr-image]
                trigger: true
              - *pending_status_notification
          - get: pr-image
            passed: [pr-image]
            params: { format: oci }
          - get: postgres-image
            params: { format: oci }
          - get: unit-image
          - get: ci
      - across:
          - var: runtime
            values:
              - guardian
              - containerd
            max_in_flight: all
        task: testflight
        image: unit-image
        timeout: 2h
        privileged: true
        file: ci/tasks/testflight/task.yml
        input_mapping: { concourse: concourse-pr, dev-image: pr-image }
        params:
          RUNTIME: ((.:runtime))
          DOWNLOAD_CLI: false

  - name: watsjs
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                passed: [pr-image]
                trigger: true
              - *pending_status_notification
          - get: pr-image
            passed: [pr-image]
            params: { format: oci }
          - get: postgres-image
            params: { format: oci }
          - get: ci
      - task: yarn-build
        file: ci/tasks/yarn-build/task.yml
        input_mapping: { concourse: concourse-pr }
      - task: watsjs
        timeout: 1h
        privileged: true
        file: ci/tasks/watsjs/task.yml
        input_mapping: { concourse: built-concourse, dev-image: pr-image }

  - name: integration
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                passed: [pr-image]
                trigger: true
              - *pending_status_notification
          - get: concourse-image
            params: { format: oci }
          - get: pr-image
            passed: [pr-image]
            params: { format: oci }
          - get: postgres-image
            params: { format: oci }
          - get: vault-image
            params: { format: oci }
          - get: ci
          - get: unit-image
      - task: integration
        image: unit-image
        timeout: 2h
        privileged: true
        input_mapping: { concourse: concourse-pr, dev-image: pr-image }
        file: ci/tasks/integration-tests/task.yml

  - name: go-format-check
    public: true
    serial: true
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
              - *pending_status_notification
          - get: unit-image
          - get: ci
      - task: check-format-for-go-files
        image: unit-image
        input_mapping:
          concourse: concourse-pr
        file: ci/tasks/check-gofmt/task.yml

  - name: govulncheck
    public: true
    serial: true
    serial_groups: [heavy]
    tags: [pr]
    <<: *status_notifications
    plan:
      - in_parallel:
          - do:
              - get: concourse-pr
                trigger: true
              - *pending_status_notification
          - get: golang-builder-image
          - get: ci
      - task: govulncheck
        timeout: 30m
        image: golang-builder-image
        file: ci/tasks/govulncheck/task.yml
        input_mapping: { concourse: concourse-pr }
